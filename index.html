<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heróis - Níveis de XP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #9d4edd 0%, #7209b7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        .card {
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 320px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 3px solid #9d4edd;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(157, 78, 221, 0.4);
            border-color: #7209b7;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #9d4edd, #7209b7);
        }

        .card-image {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 100px;
            overflow: hidden;
        }

        .card-content {
            text-align: center;
        }

        .card-name {
            font-size: 1.5rem;
            color: #7209b7;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-xp {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
            padding: 10px;
            background: #f0e6ff;
            border-radius: 8px;
            font-weight: 500;
        }

        .card-info {
            padding: 15px;
            background: #f9f5ff;
            border-radius: 8px;
            border-left: 4px solid #9d4edd;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-info.hidden {
            display: none;
        }

        .card-nivel {
            font-size: 1.2rem;
            color: #9d4edd;
            font-weight: bold;
        }

        .card-click-hint {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 15px;
            font-style: italic;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #9d4edd, #7209b7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Heróis da Marvel </h1>
            <p>Clique nos cards para ver o nível de cada herói</p>
        </div>

        <div class="cards-grid" id="cardsContainer"></div>
    </div>

    <script>
        const heroesData = [
            {
                nome: "Mulher Maravilha",
                xp: 5550,
                emoji: "👸",
                src: 'https://www.pngkey.com/png/detail/18-188278_wonder-woman-png-transparent.png',
                alt: 'imagem da mulher maravilha'
            },
            {
                nome: "Homem de Ferro",
                xp: 7800,
                emoji: "🤖",
                src: 'https://www.pngkey.com/png/detail/88-889362_iron-man-png-transparent.png',
                alt: 'imagem do homem de ferro'
            },
            {
                nome: "Capitão América",
                xp: 9851,
                emoji: "🛡️",
                src: 'https://www.pngkey.com/png/detail/95-953372_captain-america-png-transparent.png',
                alt: 'imagem do capitão américa'
            }
        ];

        function nivelPorXp(valor) {
            if (valor <= 1000) return "Ferro";
            if (valor <= 2000) return "Bronze";
            if (valor <= 5000) return "Prata";
            if (valor <= 7000) return "Ouro";
            if (valor <= 8000) return "Platina";
            if (valor <= 9000) return "Ascendente";
            if (valor <= 10000) return "Imortal";
            return "Radiante";
        }

        function createCard(hero) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const nivel = nivelPorXp(hero.xp);
            
            card.innerHTML = `
                <div class="card-image" style="background: url('${hero.src}') center/cover no-repeat;"></div>
                <div class="card-content">
                    <div class="card-name">${hero.nome}</div>
                    <div class="card-xp">⭐ XP: ${hero.xp.toLocaleString('pt-BR')}</div>
                    <div class="card-info" style="display: none;">
                        <div class="card-nivel">Nível: <span class="badge">${nivel}</span></div>
                    </div>
                    <div class="card-click-hint">Clique para ver o nível</div>
                </div>
            `;

            card.addEventListener('click', function() {
                const cardInfo = card.querySelector('.card-info');
                const hint = card.querySelector('.card-click-hint');
                
                if (cardInfo.style.display === 'none') {
                    cardInfo.style.display = 'flex';
                    hint.textContent = 'Clique para ocultar o nível';
                } else {
                    cardInfo.style.display = 'none';
                    hint.textContent = 'Clique para ver o nível';
                }
            });

            return card;
        }

        // Renderizar os cards
        const container = document.getElementById('cardsContainer');
        heroesData.forEach(hero => {
            container.appendChild(createCard(hero));
        });
    </script>
</body>
</html>
